<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Reservasi Laboratorium Komputer</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col justify-between">

    <div class="max-w-3xl mx-auto w-full">
        <!-- Header / Banner -->
        <div class="bg-white rounded-t-2xl shadow-sm border border-slate-200/80 p-6 sm:p-8 border-b-4 border-b-blue-600">
            <div class="flex items-center space-x-3 text-blue-600 mb-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
                <span class="text-sm font-semibold tracking-wider uppercase text-blue-600">Formulir Sekolah</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800">Sistem Reservasi Laboratorium Komputer</h1>
            <p class="text-slate-500 mt-2 text-sm sm:text-base">
                Silakan isi formulir di bawah ini untuk mengajukan peminjaman ruang laboratorium komputer di luar jam pelajaran.
            </p>
        </div>

        <!-- Main Form Container -->
        <div class="bg-white rounded-b-2xl shadow-md border-x border-b border-slate-200/80 p-6 sm:p-8">
            <form id="reservationForm" onsubmit="handleFormSubmit(event)" class="space-y-6">

                <!-- 1. Borrower's Name -->
                <div>
                    <label for="borrowerName" class="block text-sm font-medium text-slate-700 mb-1">
                        Nama Peminjam <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="borrowerName" 
                        name="borrowerName" 
                        required 
                        placeholder="Masukkan nama lengkap Anda"
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 outline-none"
                    >
                </div>

                <!-- 2. Status (Radio Buttons) -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Status Peminjam <span class="text-red-500">*</span>
                    </label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="flex items-center p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                            <input type="radio" name="status" value="Teacher" required class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300">
                            <span class="ml-2.5 text-sm font-medium text-slate-700">Teacher (Guru)</span>
                        </label>
                        <label class="flex items-center p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                            <input type="radio" name="status" value="Student" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300">
                            <span class="ml-2.5 text-sm font-medium text-slate-700">Student (Siswa)</span>
                        </label>
                        <label class="flex items-center p-3 rounded-lg border border-slate-200 hover:bg-slate-50 cursor-pointer transition">
                            <input type="radio" name="status" value="Organization" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-slate-300">
                            <span class="ml-2.5 text-sm font-medium text-slate-700">Organization (Organisasi)</span>
                        </label>
                    </div>
                </div>

                <!-- 3. Purpose -->
                <div>
                    <label for="purpose" class="block text-sm font-medium text-slate-700 mb-1">
                        Tujuan Peminjaman <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="purpose" 
                        name="purpose" 
                        required 
                        placeholder="Practicum, Practice, OSIS Meeting, etc."
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 outline-none"
                    >
                </div>

                <!-- 4. Borrowed Lab -->
                <div>
                    <label for="labSelect" class="block text-sm font-medium text-slate-700 mb-1">
                        Laboratorium yang Dipinjam <span class="text-red-500">*</span>
                    </label>
                    <select 
                        id="labSelect" 
                        name="labSelect" 
                        required
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 bg-white outline-none"
                    >
                        <option value="" disabled selected>-- Pilih Laboratorium --</option>
                        <option value="Lab 1 (Software)">Lab 1 (Software)</option>
                        <option value="Lab 2 (Hardware)">Lab 2 (Hardware)</option>
                    </select>
                </div>

                <!-- Grid layout for Date, Time, and Participants -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- 5. Date of Use -->
                    <div>
                        <label for="dateOfUse" class="block text-sm font-medium text-slate-700 mb-1">
                            Tanggal <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="date" 
                            id="dateOfUse" 
                            name="dateOfUse" 
                            required
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 outline-none text-sm"
                        >
                    </div>

                    <!-- 6. Start Time -->
                    <div>
                        <label for="startTime" class="block text-sm font-medium text-slate-700 mb-1">
                            Jam Mulai <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="time" 
                            id="startTime" 
                            name="startTime" 
                            required
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 outline-none text-sm"
                        >
                    </div>

                    <!-- 7. End Time -->
                    <div>
                        <label for="endTime" class="block text-sm font-medium text-slate-700 mb-1">
                            Jam Selesai <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="time" 
                            id="endTime" 
                            name="endTime" 
                            required
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 outline-none text-sm"
                        >
                    </div>

                    <!-- 8. Number of Participants -->
                    <div>
                        <label for="participants" class="block text-sm font-medium text-slate-700 mb-1">
                            Jumlah Peserta <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="number" 
                            id="participants" 
                            name="participants" 
                            min="1" 
                            max="100" 
                            required
                            placeholder="Contoh: 30"
                            class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 outline-none text-sm"
                        >
                    </div>
                </div>

                <!-- 9. Special Requirements -->
                <div>
                    <label for="specialRequirements" class="block text-sm font-medium text-slate-700 mb-1">
                        Kebutuhan Khusus
                    </label>
                    <textarea 
                        id="specialRequirements" 
                        name="specialRequirements" 
                        rows="3" 
                        placeholder="Need internet access, need a projector, etc."
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150 ease-in-out text-slate-800 placeholder-slate-400 outline-none resize-y"
                    ></textarea>
                </div>

                <!-- 10. Submit Button (With hover and active effects) -->
                <div class="pt-2">
                    <button 
                        type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:shadow-lg transition duration-200 ease-in-out flex items-center justify-center space-x-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                    >
                        <span>Submit Reservation</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                        </svg>
                    </button>
                </div>

            </form>
        </div>

        <!-- Success Alert Modal (hidden by default) -->
        <div id="successModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl max-w-md w-full p-6 text-center shadow-xl transform transition-all">
                <div class="w-12 h-12 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-2">Reservasi Berhasil Diajukan!</h3>
                <p class="text-slate-600 text-sm mb-6">
                    Permohonan reservasi laboratorium Anda telah berhasil dikirim dan menunggu konfirmasi.
                </p>
                <button 
                    onclick="closeModal()" 
                    class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg transition"
                >
                    Tutup
                </button>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-slate-400">
