
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Computer Lab Reservation System</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6"></body>
<body class="bg-slate-100 min-h-screen py-8 px-4 sm:px-6 lg:px-8 flex flex-col justify-between">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

  <!-- Container Utama -->
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 sm:p-8 border border-slate-200">
    
    <!-- Header -->
    <div class="mb-6 border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-800">Computer Lab Reservation</h1>
      <p class="text-slate-500 text-sm mt-1">Please fill out the form below to reserve a computer lab.</p>
    </div>

    <!-- Form -->
    <form action="#" method="POST" class="space-y-5" onsubmit="event.preventDefault(); alert('Reservation Submitted!');">
      
      <!-- 1. Borrower's Name -->
      <div>
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Borrower's Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your full name" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <!-- 2. Status (Radio Buttons) -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">Status</label>
        <div class="flex flex-wrap gap-4 text-sm text-slate-700">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="status" value="Teacher" required class="accent-blue-600"> Teacher
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="status" value="Student" class="accent-blue-600"> Student
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="radio" name="status" value="Organization" class="accent-blue-600"> Organization
          </label>
        </div>
      </div>

      <!-- 3. Purpose -->
      <div>
        <label for="purpose" class="block text-sm font-semibold text-slate-700 mb-1">Purpose</label>
        <input type="text" id="purpose" name="purpose" required placeholder="Practicum, Practice, OSIS Meeting, etc." 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <!-- 4. Borrowed Lab -->
      <div>
        <label for="lab" class="block text-sm font-semibold text-slate-700 mb-1">Borrowed Lab</label>
        <select id="lab" name="lab" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition bg-white">
          <option value="" disabled selected>Select a lab...</option>
          <option value="Lab 1 (Software)">Lab 1 (Software)</option>
          <option value="Lab 2 (Hardware)">Lab 2 (Hardware)</option>
        </select>
      </div>

      <!-- 5. Date of Use, 6. Start Time, 7. End Time -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div>
          <label for="date" class="block text-sm font-semibold text-slate-700 mb-1">Date of Use</label>
          <input type="date" id="date" name="date" required 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm">
        </div>
        <div>
          <label for="start_time" class="block text-sm font-semibold text-slate-700 mb-1">Start Time</label>
          <input type="time" id="start_time" name="start_time" required 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm">
        </div>
        <div>
          <label for="end_time" class="block text-sm font-semibold text-slate-700 mb-1">End Time</label>
          <input type="time" id="end_time" name="end_time" required 
            class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm">
        </div>
      </div>

      <!-- 8. Number of Participants -->
      <div>
        <label for="participants" class="block text-sm font-semibold text-slate-700 mb-1">Number of Participants</label>
        <input type="number" id="participants" name="participants" min="1" required placeholder="e.g. 30" 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
      </div>

      <!-- 9. Special Requirements -->
      <div>
        <label for="requirements" class="block text-sm font-semibold text-slate-700 mb-1">Special Requirements</label>
        <textarea id="requirements" name="requirements" rows="3" placeholder="Need internet access, need a projector, etc." 
          class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"></textarea>
      </div>

      <!-- 10. Submit Button (Dengan Hover Effect untuk tantangan opsional) -->
      <div>
        <button type="submit" 
          class="w-full bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Submit Reservation
        </button>
      </div>

    </form>
  </div>

</body>
</html>
